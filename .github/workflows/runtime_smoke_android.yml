name: Runtime Smoke Android

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        required: false
        default: debug
        type: choice
        options:
          - debug
          - profile
          - release
      smoke_wait_seconds:
        description: Runtime smoke wait seconds
        required: false
        default: "5"
        type: string
      application_id:
        description: Android applicationId
        required: false
        default: com.example.piliplus
        type: string
      fail_on_pending:
        description: Fail workflow if closure pending blockers exist
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      fail_on_runtime_validation_pending:
        description: Fail workflow only when runtime_validation blockers remain
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      fail_if_environment_not_ready:
        description: Fail workflow when environment blockers remain
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      environment_profile:
        description: Environment readiness profile
        required: false
        default: strict
        type: choice
        options:
          - strict
          - android
          - ios
      min_windows_smoke_reports:
        description: Minimum windows runtime-smoke report count for validation
        required: false
        default: "1"
        type: string
      min_android_smoke_logs:
        description: Minimum android runtime-smoke log count for validation
        required: false
        default: "1"
        type: string

jobs:
  runtime-smoke-android:
    name: Build + Runtime Smoke (Android)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true

      - name: Build with integrated runtime smoke
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File tools/release/build_all.ps1
          -Targets android
          -Mode ${{ github.event.inputs.mode || 'debug' }}
          -InstallAndroidApk
          -LaunchAndroidAfterInstall
          -AndroidApplicationId "${{ github.event.inputs.application_id || 'com.example.piliplus' }}"
          -RunRuntimeSmoke
          -RuntimeSmokeWaitSeconds ${{ github.event.inputs.smoke_wait_seconds || '5' }}
          -ArtifactManifestPath build/artifacts/android-runtime-smoke-manifest.json

      - name: Emit runtime closure status snapshot
        id: closure_status
        shell: pwsh
        continue-on-error: true
        run: |
          $command = @(
            "powershell", "-ExecutionPolicy", "Bypass", "-File", "tools/release/runtime_closure_status.ps1",
            "-OutputPath", "build/runtime-smoke/android-closure-status.json",
            "-MinWindowsSmokeReports", "${{ github.event.inputs.min_windows_smoke_reports || '1' }}",
            "-MinAndroidSmokeLogs", "${{ github.event.inputs.min_android_smoke_logs || '1' }}"
          )
          if ("${{ github.event.inputs.fail_on_pending || 'false' }}" -eq "true") {
            $command += "-FailOnPending"
          }
          & $command[0] @($command[1..($command.Length - 1)])
          $closureExitCode = $LASTEXITCODE
          "closure_exit_code=$closureExitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($closureExitCode -ne 0) {
            Write-Warning "runtime_closure_status exited with code $closureExitCode"
          }

      - name: Generate reverse completion report
        if: always()
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/release/reverse_completion_check.ps1 `
            -SkipStatus `
            -MinWindowsSmokeReports "${{ github.event.inputs.min_windows_smoke_reports || '1' }}" `
            -MinAndroidSmokeLogs "${{ github.event.inputs.min_android_smoke_logs || '1' }}"

      - name: Run environment readiness check
        id: env_readiness
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $profile = "${{ github.event.inputs.environment_profile || 'strict' }}"
          $command = @(
            "powershell", "-ExecutionPolicy", "Bypass", "-File", "tools/release/runtime_environment_readiness.ps1",
            "-StatusOutputPath", "build/runtime-smoke/android-environment-readiness-status.json",
            "-ReportOutputPath", "build/runtime-smoke/android-environment-readiness-report.json"
          )
          if ($profile -eq "android") {
            $command += "-SkipIosRequirement"
          } elseif ($profile -eq "ios") {
            $command += "-SkipAdbRequirement"
            $command += "-SkipAndroidDeviceRequirement"
          }
          & $command[0] @($command[1..($command.Length - 1)])
          $envExitCode = $LASTEXITCODE
          "env_exit_code=$envExitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($envExitCode -ne 0) {
            Write-Warning "runtime_environment_readiness exited with code $envExitCode"
          }

      - name: Append closure summary
        if: always()
        shell: pwsh
        run: |
          $jsonPath = "build/runtime-smoke/reverse-completion-report.json"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Reverse Completion (Android)"
          if (-not (Test-Path $jsonPath)) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- status: missing json report"
            exit 0
          }
          $payload = Get-Content -Raw $jsonPath | ConvertFrom-Json
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- overallReady: `{0}`" -f $payload.overallReady)
          if ($payload.blockerCounts) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- blockerCounts: environment=`{0}` runtime_validation=`{1}`" -f $payload.blockerCounts.environment, $payload.blockerCounts.runtimeValidation)
          }
          if ($payload.pending -and $payload.pending.Count -gt 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- pending blockers:"
            foreach ($item in $payload.pending) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("  - `{0}`" -f $item)
            }
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- pending blockers: none"
          }
          if ($payload.nextActions -and $payload.nextActions.Count -gt 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- next actions:"
            foreach ($item in $payload.nextActions) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("  - {0}" -f $item)
            }
          }

      - name: Append environment readiness summary
        if: always()
        shell: pwsh
        run: |
          $jsonPath = "build/runtime-smoke/android-environment-readiness-report.json"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Environment Readiness (Android)"
          if (-not (Test-Path $jsonPath)) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- status: missing environment readiness report"
            exit 0
          }
          $payload = Get-Content -Raw $jsonPath | ConvertFrom-Json
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- ready: `{0}`" -f $payload.ready)
          if ($payload.requirements) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- requirements: adb=`{0}` androidDevice=`{1}` ios=`{2}`" -f $payload.requirements.requireAdb, $payload.requirements.requireAndroidDevice, $payload.requirements.requireIosEnvironment)
          }
          if ($payload.failedChecks -and $payload.failedChecks.Count -gt 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- failed checks:"
            foreach ($item in $payload.failedChecks) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("  - `{0}`" -f $item)
            }
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- failed checks: none"
          }

      - name: Upload runtime smoke reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: ignore
          name: android-runtime-smoke-reports
          path: build/runtime-smoke/*.log

      - name: Upload closure status snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: ignore
          name: android-runtime-closure-status
          path: build/runtime-smoke/android-closure-status.json

      - name: Upload reverse completion report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: ignore
          name: android-reverse-completion-report
          path: build/runtime-smoke/reverse-completion-report.md

      - name: Upload reverse completion report JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: ignore
          name: android-reverse-completion-report-json
          path: build/runtime-smoke/reverse-completion-report.json

      - name: Upload runtime smoke summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: ignore
          name: android-runtime-smoke-summary
          path: build/runtime-smoke/summary.md

      - name: Upload environment readiness status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: ignore
          name: android-environment-readiness-status
          path: build/runtime-smoke/android-environment-readiness-status.json

      - name: Upload environment readiness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: ignore
          name: android-environment-readiness-report
          path: build/runtime-smoke/android-environment-readiness-report.json

      - name: Upload build artifact manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: ignore
          name: android-runtime-smoke-manifest
          path: build/artifacts/android-runtime-smoke-manifest.json

      - name: Upload built APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: ignore
          name: android-runtime-smoke-apk
          path: build/app/outputs/flutter-apk/app-*.apk

      - name: Enforce closure gate
        if: always()
        shell: pwsh
        run: |
          $failOnPending = "${{ github.event.inputs.fail_on_pending || 'false' }}"
          $failOnRuntimeValidation = "${{ github.event.inputs.fail_on_runtime_validation_pending || 'false' }}"
          $failOnEnvironment = "${{ github.event.inputs.fail_if_environment_not_ready || 'false' }}"
          $closureExitCode = "${{ steps.closure_status.outputs.closure_exit_code }}"
          $envExitCode = "${{ steps.env_readiness.outputs.env_exit_code }}"
          $payload = $null
          $jsonPath = "build/runtime-smoke/reverse-completion-report.json"
          if (($failOnRuntimeValidation -eq "true" -or $failOnEnvironment -eq "true")) {
            if (-not (Test-Path $jsonPath)) {
              throw "reverse completion json report is missing for selected gate mode"
            }
            $payload = Get-Content -Raw $jsonPath | ConvertFrom-Json
          }
          if ($failOnRuntimeValidation -eq "true") {
            $runtimeValidationCount = [int]$payload.blockerCounts.runtimeValidation
            if ($runtimeValidationCount -gt 0) {
              throw "runtime-validation gate failed (runtimeValidation blockers: $runtimeValidationCount)"
            }
          }
          if ($failOnEnvironment -eq "true") {
            $envPath = "build/runtime-smoke/android-environment-readiness-report.json"
            if (-not (Test-Path $envPath)) {
              throw "environment gate failed: readiness report is missing"
            }
            $envPayload = Get-Content -Raw $envPath | ConvertFrom-Json
            if (-not [bool]$envPayload.ready) {
              $failedChecks = if ($envPayload.failedChecks) { @($envPayload.failedChecks) -join ", " } else { "unknown" }
              throw "environment gate failed (failedChecks: $failedChecks)"
            }
            if ($envExitCode -ne "" -and $envExitCode -ne "0") {
              throw "environment gate failed (script exit code: $envExitCode)"
            }
          }
          if ($failOnPending -eq "true" -and $closureExitCode -ne "" -and $closureExitCode -ne "0") {
            throw "closure gate failed (exit code: $closureExitCode)"
          }
